<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diario di allenamento</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1D2830">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#E8EBE6; --surface:#F6F7F4; --raise:#FFFFFF; --ink:#1D2830; --muted:#5C6970; --line:#C9D0C8;
  --accent:#1D2830; --on-accent:#F6F7F4;
  --ok:#92D050; --fat:#FFC000; --ko:#E3342F; --skip:#0070C0; --on-ok:#1D2830; --on-ko:#FFFFFF;
  --rest:#DCE6E2; --warn:#FFC000;
  --f-text:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#141B20; --surface:#1C252B; --raise:#243037; --ink:#E4EAE5; --muted:#9AA7AE; --line:#34434C;
    --accent:#E4EAE5; --on-accent:#141B20; --rest:#1F3330;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#141B20; --surface:#1C252B; --raise:#243037; --ink:#E4EAE5; --muted:#9AA7AE; --line:#34434C;
  --accent:#E4EAE5; --on-accent:#141B20; --rest:#1F3330;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-text);min-height:100%;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--skip);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 120px}
h1,h2,h3{font-family:var(--f-num);font-weight:700;letter-spacing:.01em;margin:0;line-height:1.1}
h1{font-size:32px}
h2{font-size:24px}
h3{font-size:20px}
.muted{color:var(--muted)}
.small{font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* barra superiore */
.top{display:flex;align-items:baseline;gap:12px;margin:4px 0 16px}
.top .save{margin-left:auto;font-size:14px;color:var(--muted)}
.banner{background:var(--raise);border-left:4px solid var(--fat);padding:10px 12px;margin:0 0 16px;font-size:14px}

/* tab in basso */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;max-width:200px;background:none;border:0;padding:7px 2px 8px;font-family:var(--f-num);font-size:15px;font-weight:600;color:var(--muted);border-top:3px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button svg{width:25px;height:25px}
.tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--ink)}
.minitimer{position:fixed;left:0;right:0;z-index:19;bottom:calc(64px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none}
.minitimer[hidden]{display:none}
.minitimer button{pointer-events:auto;background:var(--accent);color:var(--on-accent);border:0;border-radius:20px;padding:6px 16px;font-family:var(--f-num);font-size:18px;font-weight:600;margin-bottom:8px}

/* campi */
label.f{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted);min-width:0}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0;color:var(--ink);font-size:16px}
textarea{resize:vertical;min-height:44px}
input[type=number]{font-family:var(--f-num);font-size:19px;font-weight:600}
.btn{border:1px solid var(--line);background:var(--raise);border-radius:6px;padding:9px 14px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.big{font-family:var(--f-num);font-size:22px;padding:12px 22px}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--ko)}
.btn:disabled{opacity:.45;cursor:default}

/* seduta */
.sess-head{display:grid;grid-template-columns:1fr 90px;gap:10px;margin-bottom:6px}
.sess-meta{font-family:var(--f-num);font-size:18px;color:var(--muted);margin:0 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;margin:0 0 14px}
.card-h{display:flex;gap:8px;align-items:center}
.card-h input{font-family:var(--f-num);font-size:22px;font-weight:700;border-color:transparent;background:transparent;padding:4px 6px}
.card-h input:hover,.card-h input:focus{border-color:var(--line);background:var(--raise)}
.sugg{font-size:14px;color:var(--muted);margin:2px 6px 10px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
.grid .wide{grid-column:span 4}
.grid label.f{justify-content:flex-end}
@media (min-width:600px){.grid{grid-template-columns:repeat(8,minmax(0,1fr))}.grid .wide{grid-column:span 4}}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 6px}
.chip{width:52px;height:56px;border-radius:6px;border:2px solid var(--line);background:var(--raise);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;line-height:1}
.chip b{font-family:var(--f-num);font-size:26px;font-weight:700}
.chip small{font-size:11px;margin-top:2px;opacity:.8}
.chip.e-{color:var(--muted);border-style:dashed}
.chip.e-ok{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.chip.e-fat{background:var(--fat);border-color:var(--fat);color:var(--on-ok)}
.chip.e-ko{background:var(--ko);border-color:var(--ko);color:var(--on-ko)}
.chip.e-skip{background:var(--skip);border-color:var(--skip);color:var(--on-ko)}
.hint{font-size:13px;color:var(--muted);margin:0 0 10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px 12px;margin:12px 0 4px;padding-top:10px;border-top:1px solid var(--line)}
@media (min-width:600px){.metrics{grid-template-columns:repeat(5,minmax(0,1fr))}}
.metrics div{display:flex;flex-direction:column}
.metrics span{font-size:12px;color:var(--muted)}
.metrics b{font-family:var(--f-num);font-size:20px;font-weight:600}
.card-a{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.prog{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px;padding:10px;background:var(--raise);border-radius:6px}
.prog p{grid-column:1/-1;margin:0;font-size:13px;color:var(--muted)}
.add{display:flex;gap:8px;margin:6px 0 18px}

/* nuova seduta */
.tpl{display:flex;flex-direction:column;gap:8px;margin:14px 0 22px}
.tpl button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;grid-template-columns:56px 1fr;gap:2px 12px;align-items:center}
.tpl .wo{grid-row:span 2;font-family:var(--f-num);font-size:34px;font-weight:700;text-align:center;line-height:1}
.tpl .when{font-size:14px;color:var(--muted)}
.tpl .what{font-weight:600}

/* storico */
.week{margin:0 0 18px}
.week-h{display:flex;align-items:baseline;gap:10px;padding:0 2px 6px;border-bottom:2px solid var(--ink);margin-bottom:8px}
.week-h{flex-wrap:wrap}
.week-h h3{font-size:20px;white-space:nowrap}
.week-h span{font-size:14px;color:var(--muted)}
.sess{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin:0 0 8px}
.sess > button{all:unset;cursor:pointer;display:block;width:100%;box-sizing:border-box;padding:10px 12px}
.sess > button:focus-visible{outline:3px solid var(--skip)}
.sess-t{display:flex;gap:10px;align-items:baseline;margin-bottom:4px}
.sess-t b{font-family:var(--f-num);font-size:19px}
.sess-t .wo{font-family:var(--f-num);font-weight:700;font-size:19px;background:var(--ink);color:var(--bg);border-radius:4px;padding:0 6px}
.exl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;font-size:15px}
.exl .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{display:flex;gap:2px}
.mini i{width:10px;height:14px;border-radius:2px;background:var(--line)}
.mini i.e-ok{background:var(--ok)}.mini i.e-fat{background:var(--fat)}.mini i.e-ko{background:var(--ko)}.mini i.e-skip{background:var(--skip)}
.sess-d{padding:0 12px 12px;border-top:1px solid var(--line)}
.sess-d .ex{padding:10px 0;border-bottom:1px dashed var(--line)}
.sess-d .ex:last-of-type{border-bottom:0}
.sess-d p{margin:4px 0;font-size:14px}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;margin:0 0 14px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}

/* timer */
.seg{display:flex;border:2px solid var(--ink);border-radius:8px;overflow:hidden;margin:0 0 18px}
.seg button{flex:1;background:none;border:0;padding:10px 6px;font-family:var(--f-num);font-size:20px;font-weight:600;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg.sm{border-width:1px;margin:0}
.seg.sm button{font-size:17px;padding:7px 4px}
.tcfg{display:flex;flex-direction:column;gap:14px}
.tcfg .lead{margin:0;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--raise);width:max-content}
.stepper button{background:none;border:0;width:48px;height:48px;font-size:24px;font-weight:600}
.stepper output{min-width:56px;text-align:center;font-family:var(--f-num);font-size:26px;font-weight:700}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
.swatches input[type=color]{width:42px;height:34px;padding:2px;border:1px solid var(--line);border-radius:6px;background:var(--raise)}
.emx{display:flex;flex-direction:column;gap:2px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.exrow{display:grid;grid-template-columns:minmax(0,1fr) 72px 84px;gap:8px;align-items:end}
.run{border-radius:12px;padding:20px 16px 22px;text-align:center;background:var(--accent);color:var(--on-accent);transition:background .25s}
.run.rest{background:var(--rest);color:var(--ink)}
.run.flash{background:var(--warn);color:#1D2830}
.run.done{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.run .ph{font-family:var(--f-num);font-size:22px;font-weight:600;margin:0}
.run .ex-now{font-family:var(--f-num);font-size:clamp(30px,8vw,46px);font-weight:700;margin:6px 0 0;line-height:1.05}
.run .clock{font-family:var(--f-num);font-weight:700;font-size:clamp(96px,30vw,210px);line-height:.95;font-variant-numeric:tabular-nums;margin:6px 0}
.run .sub{font-size:17px;margin:0;opacity:.85}
.run .ctl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.run .btn{background:transparent;color:inherit;border-color:currentColor}
.run .btn.primary{background:var(--pfg,var(--on-accent));color:var(--pbg,var(--accent));border-color:var(--pfg,var(--on-accent))}
.run.rest .btn.primary,.run.done .btn.primary,.run.flash .btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.repadj{display:flex;align-items:center;justify-content:center;gap:16px;margin:10px 0 4px}
.repadj button{width:64px;height:64px;border-radius:50%;border:2px solid currentColor;background:transparent;color:inherit;font-size:32px;font-weight:600}
.repadj output{font-family:var(--f-num);font-size:64px;font-weight:700;min-width:80px}
.esito{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px auto 0;max-width:420px}
.esito button{border:0;border-radius:6px;padding:12px 6px;font-weight:600}
.esito button{border:2px solid rgba(255,255,255,.75)}
.esito button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink);text-decoration:underline}
.tot{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;text-align:left}
.tot div{background:rgba(127,127,127,.14);border-radius:6px;padding:8px 10px}
.tot b{font-family:var(--f-num);font-size:24px;display:block}
.sumlist{text-align:left;margin:12px auto 0;max-width:420px;font-size:15px}

/* foglio in basso */
.sheet-bg{position:fixed;inset:0;background:rgba(10,15,18,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:14px 14px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin-bottom:4px}
.sheet .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.sheet .opts button{border:0;border-radius:8px;padding:14px 10px;font-weight:600;font-size:16px}
.o-ok{background:var(--ok);color:var(--on-ok)}.o-fat{background:var(--fat);color:var(--on-ok)}.o-ko{background:var(--ko);color:var(--on-ko)}.o-skip{background:var(--skip);color:var(--on-ko)}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
body.lock{overflow:hidden}
.run.full{position:fixed;inset:0;z-index:30;border-radius:0;margin:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top" "main" "side";gap:clamp(4px,1.2vh,14px);padding:calc(env(safe-area-inset-top,0px) + clamp(6px,1.5vh,14px)) clamp(10px,3vw,28px) calc(env(safe-area-inset-bottom,0px) + clamp(8px,2vh,18px));overflow:hidden}
.r-top{grid-area:top;display:flex;align-items:center;gap:10px;font-family:var(--f-num);font-size:clamp(15px,min(3.8vw,2.6vh),24px);font-weight:600}
.r-top .r-title{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-top .r-ses{white-space:nowrap;opacity:.9}
.r-top .fsb{background:transparent;border:1.5px solid currentColor;color:inherit;border-radius:6px;width:clamp(32px,5vh,42px);height:clamp(32px,5vh,42px);font-size:clamp(14px,2.4vh,20px);padding:0;flex:none}
.r-main{grid-area:main;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;gap:clamp(2px,.8vh,8px)}
.r-side{grid-area:side;display:flex;flex-direction:column;justify-content:center;gap:clamp(6px,1.4vh,14px);min-height:0}
.run.full .ph{font-size:clamp(16px,min(4.4vw,3.2vh),30px)}
.run.full .giro{font-family:var(--f-num);font-weight:700;font-size:clamp(34px,min(12vw,8.5vh),110px);line-height:1;margin:0;font-variant-numeric:tabular-nums}
.run.full .ex-now{font-size:clamp(20px,min(6.5vw,5vh),56px);margin:0}
.run.full .clock{font-size:clamp(48px,min(25vw,24vh),320px);margin:0;white-space:nowrap}
.run.full .sub{font-size:clamp(13px,min(3.8vw,2.5vh),22px);margin:0}
.run.full .ctl{margin:0;gap:clamp(6px,1.2vw,12px)}
.run.full .btn{font-size:clamp(14px,min(3.8vw,2.4vh),20px);padding:clamp(6px,1.1vh,12px) clamp(10px,2.2vw,20px)}
.run.full .btn.big{font-size:clamp(18px,min(5.2vw,3.4vh),30px);padding:clamp(8px,1.6vh,16px) clamp(16px,3vw,30px)}
.run.full .repadj{margin:0;gap:clamp(10px,3vw,22px)}
.run.full .repadj button{width:clamp(40px,min(12vw,7vh),76px);height:clamp(40px,min(12vw,7vh),76px);font-size:clamp(22px,4vh,34px)}
.run.full .repadj output{font-size:clamp(30px,min(11vw,7vh),76px);min-width:2ch}
.run.full .esito{margin:0 auto;width:100%}
.run.full .esito button{padding:clamp(6px,1.3vh,14px) 4px;font-size:clamp(13px,min(3.6vw,2.2vh),18px)}
.run.full .tot{margin:0;gap:clamp(6px,1vw,10px)}
.run.full .tot div{padding:clamp(4px,.8vh,8px) 10px;font-size:clamp(12px,1.8vh,16px)}
.run.full .tot b{font-size:clamp(16px,2.8vh,26px)}
.run:not(.full) .msub{margin-top:14px}
/* timer: dati più grandi e pulsanti facili da toccare */
.run.full .r-top{font-size:clamp(18px,min(4.8vw,3.4vh),34px)}
.run.full .r-top .r-ses{font-size:clamp(15px,min(3.8vw,2.6vh),24px);font-weight:600}
.run.full .ph{font-size:clamp(18px,min(5.6vw,4vh),42px)}
.run.full .giro{font-size:clamp(40px,min(16vw,10vh),150px)}
.run.full .ex-now{font-size:clamp(24px,min(8vw,6vh),76px)}
.run.full .clock{font-size:clamp(52px,min(27vw,25vh),340px)}
.run.full .sub{font-size:clamp(16px,min(5vw,3.2vh),32px)}
.run.full .btn{font-size:clamp(16px,min(4.6vw,2.9vh),28px);min-height:clamp(44px,7vh,84px);border-width:2px;line-height:1.15}
.run.full .btn.big,.run.full .r-side .btn.primary{font-size:clamp(20px,min(6.2vw,4vh),42px);min-height:clamp(52px,9.5vh,110px);width:100%}
.run.full .ctl2{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));width:100%}
.run.full .ctl2 .btn{padding-left:6px;padding-right:6px}
.run.full .repadj button{width:clamp(52px,min(18vw,10.5vh),116px);height:clamp(52px,min(18vw,10.5vh),116px);font-size:clamp(28px,6vh,56px);border-width:3px}
.run.full .repadj output{font-size:clamp(40px,min(15vw,9.5vh),110px)}
.run.full .esito{gap:clamp(6px,1.4vw,14px);max-width:none}
.run.full .esito button{min-height:clamp(48px,8.5vh,96px);font-size:clamp(15px,min(4.4vw,2.9vh),28px);padding:4px}
.run.full .tot div{font-size:clamp(14px,2.2vh,22px)}
.run.full .tot b{font-size:clamp(20px,3.8vh,40px)}
@media (orientation:landscape){
  .run.full .clock{font-size:clamp(48px,min(16.5vw,40vh),340px)}
  .run.full .giro{font-size:clamp(36px,min(9vw,12vh),150px)}
  .run.full .ex-now{font-size:clamp(22px,min(5vw,7vh),76px)}
}
@media (orientation:landscape){
  .run.full{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top top" "main side"}
  .run.full .clock{font-size:clamp(48px,min(16.5vw,40vh),320px)}
}
.run.full{--u:14px;gap:calc(var(--u)*.5);padding:calc(env(safe-area-inset-top,0px) + var(--u)*.6) calc(var(--u)*.9) calc(env(safe-area-inset-bottom,0px) + var(--u)*.7)}
.run.full .r-top{font-size:calc(var(--u)*1.5)}
.run.full .r-top .r-ses{font-size:clamp(15px,min(3.8vw,2.6vh),24px)}
.run.full .r-top .fsb{width:calc(var(--u)*2.4);height:calc(var(--u)*2.4);font-size:calc(var(--u)*1.2)}
.run.full .r-main{gap:calc(var(--u)*.25)}
.run.full .r-side{gap:calc(var(--u)*.6)}
.run.full .ph{font-size:calc(var(--u)*1.7);line-height:1.1}

function enduCalc(t){

  const sug=rif>0?Math.ceil(rif*E.pct/100*2)/2:null,pct=peso>0&&rif>0?(peso!==sug?Math.ceil(peso/rif*100):E.pct):E.pct;
  return {E,parts,tot,sug,pct,rate:tot?rateOf(E.rate,tot):'',rate2:E.rate2&&tot?rateOf(E.rate2,tot):'',vol:tot?tot*pct/100:null,ton:tot&&peso>0?tot*peso:null,dens:tot?tot/E.min:null,repset:t.tipo==='t15'?sugRepSet(pct):null};
}
function bwInfo(t){const rm=t.rm,bw=num(t.bw),reps=(num(t.rep)||0)+(num(t.rir)||0),tot=(bw||0)+(num(t.kg)||0);if(!(rm>0))return null;
  const pc=Math.ceil(tot*100/rm),pbw=bw>0?Math.ceil(bw*100/rm):null,mr=pbw?bwRepMax(pbw):null;
  return {pc,repset:Math.floor(reps*.5),pbw,mr,mrset:mr!=null?Math.floor(mr*.5):null}}
function testRM(t){if(t.tipo==='brz')return brzRM((num(t.bw)||0)+(num(t.kg)||0),(num(t.rep)||0)+(num(t.rir)||0));if(t.tipo==='maxrep'||t.tipo==='t30'||t.tipo==='t15')return null;if(t.tipo==='reps'){const p=pctOfReps((Number(t.rep)||0)+(Number(t.rir)||0));return p&&Number(t.kg)>0?Number(t.kg)/p:null}return Number(t.tipo==='default'?t.rm:t.kg)||null}
const cmpK=(a,b)=>{for(let i=0;i<a.length;i++){if(a[i]<b[i])return -1;if(a[i]>b[i])return 1}return 0};
function maxFor(name,iso){let best=null;for(const t of S.tests.values()){if(t.deleted||t.n!==name||!(t.rm>0)||(t.from||t.d)>iso)continue;
  const k=[t.from||t.d,t.tipo==='default'?0:1,t.d||'',t.updated||0];if(!best||cmpK(k,best.k)>0)best={t,k}}return best?best.t:null}
const pctShowOf=e=>e.pct!=null?Math.round(e.pct*1000)/10:'';
function autoPct(e,iso){if(e.pctMan||!e.n)return false;const t=maxFor(e.n,iso);if(!t||!(Number(e.kg)>0))return false;const p=Math.round(Number(e.kg)/t.rm*1000)/1000;if(p===e.pct)return false;e.pct=p;return true}
const isRmType=k=>k==='1rm'||k==='reps'||k==='brz';
const fk=x=>fmtN(x,x%1?1:0);
function testDesc(t){
  if(t.tipo==='brz')return `${num(t.bw)>0?`${fk(num(t.bw))} + `:''}${fk(num(t.kg)||0)} kg × ${t.rep}${t.rir?` (+${t.rir} in riserva)`:''}: 1RM ${fmtN(t.rm,1)} kg (Brzycki)`;
  if(t.tipo==='maxrep')return `${t.rep} ripetizioni massime a corpo libero`;
  if(t.tipo==='t30'||t.tipo==='t15'){const c=enduCalc(t);return `Test ${c.E.min}′ con ${fk(num(t.kg)||0)} kg: ${c.tot} ripetizioni (${c.parts.join(' + ')})${c.rate?`, ${c.rate.toLowerCase()}`:''}`}
  if(t.tipo==='reps')return `${fmtN(t.kg,t.kg%1?1:0)} kg × ${t.rep}${t.rir?` (+${t.rir} in riserva)`:''}: 1RM stimato ${fmtN(t.rm,1)} kg`;
  if(t.tipo==='default')return `1RM ${fmtN(t.rm,1)} kg (default)`;
  return `1RM ${fmtN(t.rm,1)} kg`;
}
const slug=n=>String(n).toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60)||'x';
const isoMinus=(iso,days)=>{const t=new Date(isoUTC(iso)-days*864e5);return `${t.getUTCFullYear()}-${pad(t.getUTCMonth()+1)}-${pad(t.getUTCDate())}`};

function ensureDefaults(force){
  if(!S.testsLoaded||!S.stor.size)return 0;
  if(!force&&S.tests.size)return 0;
  const ds=[...S.stor.values()].map(x=>x.d).sort(),lim=isoMinus(ds[ds.length-1],56),best={};
  [...S.stor.values()].filter(x=>x.d>=lim).sort((a,b)=>a.d<b.d?-1:1).forEach(x=>x.ex.forEach(e=>{
    if(e.st!=='Non eseguito'&&Number(e.kg)>0&&Number(e.pct)>0)best[e.n]={d:x.d,kg:Number(e.kg),pct:Number(e.pct)}}));
  const now=Date.now();let n=0;
  Object.entries(best).forEach(([nm,b])=>{const t={id:'def_'+slug(nm),d:b.d,n:nm,tipo:'default',kg:b.kg,pct:b.pct,rm:Math.round(b.kg/b.pct*10)/10,from:'2023-01-01',
    note:`Dal foglio Excel: ${fmtN(b.kg,b.kg%1?1:0)} kg al ${fmtN(b.pct*100)}% il ${fmtD(b.d)}`,updated:now};S.tests.set(t.id,t);saveTestDoc(t);n++});
  return n;
}
async function applyTest(t){
  const from=t.from||t.d;let n=0;
  if(S.draft&&S.draft.d>=from){S.draft.ex.forEach(e=>{if(e.n===t.n&&autoPct(e,S.draft.d))n++});if(n)scheduleSave()}
  for(const [id,x] of [...S.sed]){if(x.deleted||!x.updated||x.d<from||(S.draft&&S.draft.id===id))continue;
    const c=clone(x);let ch=false;c.ex.forEach(e=>{if(e.n===t.n&&autoPct(e,c.d))ch=true});
    if(ch){c.updated=Date.now();try{await writeSession(c);n++}catch(e){}}}
  return n;
}

/* ---------- storico: unione ---------- */
function merge(){
  const m=new Map(S.stor);
  for(const [id,s] of S.sed){if(s.deleted)m.delete(id);else m.set(id,s)}
  S.hist=[...m.values()].sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:(a.id<b.id?1:-1));
  const names=new Set();S.hist.forEach(s=>s.ex.forEach(e=>e.n&&names.add(e.n)));
  S.names=[...names].sort((a,b)=>a.localeCompare(b,'it'));
  $('#names').innerHTML=S.names.map(n=>`<option value="${esc(n)}">`).join('');
}
function lastOf(name,beforeIso,skipId){
  for(const s of S.hist){
    if(s.id===skipId||s.d>beforeIso)continue;
    for(const e of s.ex)if(e.n===name&&e.st!=='Non eseguito'&&(e.s||[]).length)return {s,e};
  }
  return null;
}
function nextPlan(e,cfg){
  const n=(e.s||[]).length;if(!n)return null;
  let b=e.b,k=e.k||0;
  const reps=e.s.map(x=>Number(x[0])||0);
  if(b==null){b=Math.min(...reps);k=0;while(k<n&&reps[k]>b)k++;}
  const failed=e.s.some((x,i)=>x[1]==='ko'||x[1]==='skip'||(x[1]!==''&&reps[i]<b+(i<k?1:0)));
  let kg=e.kg??null,why;
  if(failed){why='ultima volta qualche serie non è arrivata all’obiettivo: stesso piano';}
  else if(cfg&&cfg.tetto&&k===0&&b>=cfg.tetto){
    const rip=cfg.rip||Math.max(1,b-3);
    why=`tetto di ${cfg.tetto} raggiunto: riparti da ${rip}`+(cfg.inc&&kg?` con ${fmtN(cfg.inc,1)} kg in più`:'');
    b=rip;k=0;if(cfg.inc&&kg)kg=Math.round((Number(kg)+Number(cfg.inc))*100)/100;
  }
  else if(k+1>=n){b=b+1;k=0;why=`tutte completate: ora tutte le serie a ${b}`;}
  else{k=k+1;why=`tutte completate: ora le prime ${k} serie a ${b+1}`;}
  return {b,k,n,kg,why};
}
function exFromHistory(name,iso,skipId){
  const last=lastOf(name,iso,skipId);
  const e={n:name,p:'',t:null,kg:null,z:null,pct:null,b:null,k:0,s:[],st:'Eseguito',f:'',note:''};
  if(!last){e.s=[];setN(e,4);autoPct(e,iso);return e}
  const p=last.e;Object.assign(e,{p:p.p||'',t:p.t??null,kg:p.kg??null,z:p.z??null,pct:p.pct??null});
  const plan=nextPlan(p,S.cfg.esercizi[name]);
  if(plan){e.b=plan.b;e.k=plan.k;e.kg=plan.kg;e._why=`Ultima volta il ${fmtD(last.s.d)}: ${plan.why}.`;setN(e,plan.n)}
  else setN(e,p.s.length||4);
  autoPct(e,iso);
  return e;
}
function setN(e,n){
  n=Math.max(1,Math.min(20,n|0));const s=e.s||[];
  while(s.length<n)s.push([planned(e,s.length)??'','']);
  s.length=n;e.s=s;syncSets(e);
}
function syncSets(e){e.s.forEach((x,i)=>{if(x[1]===''){const p=planned(e,i);x[0]=p??x[0]}})}

function newDraft(iso,wo,exs){

  persistDraft();
}
function persistDraft(){store('diario-bozza',S.draft)}
function sessionObj(dr){
  const ex=dr.ex.map(e=>{const o={...e};delete o._why;return o});
  return {id:dr.id,d:dr.d,gg:ggOf(dr.d),wo:dr.wo,set:dr.set!=null&&dr.d===dr._d0?dr.set:weekOf(dr.d),note:dr.note||'',ex,...(dr.tempi?{tempi:dr.tempi}:{}),updated:Date.now()};
}
let saveTimer=null,saveChain=Promise.resolve(),lastSaved='';
function scheduleSave(){persistDraft();clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,1200);setSaveMsg('Modifiche da salvare')}
function saveNow(){
  clearTimeout(saveTimer);const dr=S.draft;if(!dr||!dr.ex.length)return saveChain;
  const obj=sessionObj(dr);const key=JSON.stringify({...obj,updated:0});
  if(key===lastSaved){setSaveMsg('Salvata');return saveChain}
  saveChain=saveChain.then(async()=>{
    setSaveMsg('Salvataggio…');
    try{
      if(S.mode==='db')await S.base.collection('sedute').doc(obj.id).set(obj);
      else{const all=load('diario-sedute')||{};all[obj.id]=obj;store('diario-sedute',all);S.sed.set(obj.id,obj);merge()}
      lastSaved=key;setSaveMsg('Salvata');
    }catch(err){setSaveMsg(err&&err.code==='quota_exceeded'?'Spazio esaurito: seduta non salvata':'Non salvata: riprovo tra poco');if(!(err&&err.code==='quota_exceeded'))setTimeout(scheduleSave,4000)}
  });

}

const RIRF={'Facile':3.5,'Facile/Liscia':2.5,'Liscia':2,'Liscia/Difficile':1.5,'Difficile':1,'Difficile/Dura':.5,'Dura':0,'Dura/Fallito':0,'Fallito':0};
function sessE1(e){
  const kg=Number(e.kg);if(e.st==='Non eseguito'||!(kg>0))return null;let best=null;
  (e.s||[]).forEach(x=>{const r=Number(x[0]);if(!(r>0)||x[1]==='skip')return;
    const rir=x[1]==='ko'?0:x[1]==='fat'?.5:(RIRF[e.f]??1.5),p=pctOfReps(Math.min(30,r+rir));if(p){const v=kg/p;if(best==null||v>best)best=v}});
  return best;
}
const PERIODI=[['3m','3 mesi',3],['6m','6 mesi',6],['12m','1 anno',12],['all','Tutto',0]];
function periodStart(){const p=PERIODI.find(x=>x[0]===S.prog)||PERIODI[1];if(!p[2])return '0000-00-00';const d=new Date();d.setMonth(d.getMonth()-p[2]);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function exSeries(name,from){
  const out=[];
  for(const s of S.hist){if(s.d<from)continue;for(const e of s.ex){if(e.n!==name||e.st==='Non eseguito')continue;const m=metrics(e,!!s.updated);
    out.push({d:s.d,e1:sessE1(e),kg:Number(e.kg)||null,tot:m.tot||0,vol:m.vol||0,ton:m.ton||0,fails:m.fails||0,sets:(e.s||[]).filter(x=>x[1]!=='skip').length})}}
  return out.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
}
function trendOf(vals){const n=vals.length;if(n<4)return null;const k=Math.max(2,Math.floor(n/4)),avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
  const a=avg(vals.slice(0,k)),b=avg(vals.slice(-k));return {a,b,pct:(b/a-1)*100}}
const trCls=pc=>pc>1?'up':pc<-1?'down':'flat',trArr=pc=>pc>1?'▲':pc<-1?'▼':'●';
const fmtPct=pc=>`${pc>0?'+':pc<0?'−':''}${fmtN(Math.abs(pc),1)}%`;
function spark(vals,cls){if(vals.length<2)return '';const lo=Math.min(...vals),hi=Math.max(...vals)||1,W=90,H=30;
  const pts=vals.map((v,i)=>`${(i/(vals.length-1)*(W-4)+2).toFixed(1)},${(H-3-(hi===lo?.5:(v-lo)/(hi-lo))*(H-6)).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" class="${cls}" aria-hidden="true"><polyline fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" points="${pts}"/></svg>`}

const TIPI=[['1rm','1RM'],['reps','Ripetizioni con carico'],['brz','5RM / corpo libero'],['maxrep','Max rip. corpo libero'],['t30','Test 30′'],['t15','Test 15′']];
const TIPI_INFO={'1rm':'Il carico massimo sollevato per una ripetizione.',
  reps:'Carico e ripetizioni fatte: il massimale si stima con la tabella del tuo foglio (ripetizioni massime ↔ % del massimale), contando anche quelle in riserva.',

function tfResult(){
  const f=S.tf,kg=num(f.kg),k=f.tipo;
  if(k==='brz'){const t={tipo:'brz',bw:f.bw,kg:f.kg,rep:f.rep,rir:f.rir};t.rm=testRM(t);if(!t.rm)return '';const b=bwInfo(t);
    return `1RM stimato <b>${fmtN(t.rm,1)} kg</b> <span class="muted small">(${b.pc}% del massimale, ${b.repset} ripetizioni per serie)</span>${b.pbw?`<br><span class="small">Solo peso corporeo: ${b.pbw}% del massimale${b.mr?`, circa ${b.mr} ripetizioni massime, ${b.mrset} per serie`:''}</span>`:''}`}
  if(k==='maxrep'){const r=num(f.rep);if(!(r>0))return '';return `Schemi di lavoro: ${[40,50,60,70,80].map(q=>`${q}% <b>${Math.floor(r*q/100)}</b>`).join(', ')} ripetizioni`}
  if(k==='t30'||k==='t15'){const c=enduCalc({tipo:k,kg:f.kg,rif:f.rif,parts:f.parts});
    const sug=c.sug?`<span class="small">Peso consigliato ${fmtN(c.sug,1)} kg (${c.E.pct}% di ${fmtN(num(f.rif),1)} kg)${c.repset?`, ${c.repset} ripetizioni per serie`:''}</span>`:'<span class="muted small">Indica il 1RM di riferimento per avere il peso consigliato.</span>';
    if(!c.tot)return sug;
    return `${c.tot} ripetizioni: <b>${c.rate}</b>${c.rate2?` <span class="muted small">(scala Miletto: ${c.rate2})</span>`:''}<br><span class="small">${c.pct}% del massimale, volume ${fmtN(c.vol,2)}${c.ton?`, tonnellaggio ${fmtN(c.ton)}`:''}, densità ${fmtN(c.dens,1)} rip/min</span><br>${sug}`}
  if(!(kg>0))return '';
  if(k==='reps'){const r=(num(f.rep)||0)+(num(f.rir)||0);if(!r)return '';const p=pctOfReps(r);
    return p?`1RM stimato <b>${fmtN(kg/p,1)} kg</b> <span class="muted small">(${r} ripetizioni massime = ${fmtN(p*100,1)}% del massimale)</span>`:'<span class="muted small">Oltre 30 ripetizioni la tabella non permette una stima.</span>'}
  return `1RM <b>${fmtN(kg,1)} kg</b>`;
}

function vStorico(){
  const ex=S.storEx;
  let h=`<div class="top"><h1>Storico</h1></div>${banner()}
  <div class="row" style="margin-bottom:16px">
    <label class="f" style="flex:1;min-width:200px">Esercizio<select data-f="st:ex"><option value="">Tutte le sedute</option>${(S.names||[]).map(n=>`<option ${n===ex?'selected':''}>${esc(n)}</option>`).join('')}</select></label>
  </div>
  <div class="row" style="margin:-6px 0 16px">${canSave()?`<button class="btn" data-a="exportCsv">Esporta CSV</button><button class="btn" data-a="exportBak">Esporta backup</button>`:''}<button class="btn" data-a="importBtn">Importa backup</button></div>`;
  if(!S.hist.length)return h+`<p class="empty">${S.mode==='loading'?'Carico lo storico…':'Nessuna seduta salvata. Le sedute che registri nel Diario compaiono qui.'}</p>`;
  if(ex)return h+vExHistory(ex);
  const weeks=new Map();
  for(const s of S.hist){const k=mondayOf(s.d);if(!weeks.has(k))weeks.set(k,[]);weeks.get(k).push(s)}
  const keys=[...weeks.keys()];
  h+=keys.slice(0,S.storWeeks).map(k=>{
    const list=weeks.get(k);let tot=0,f=0;
    list.forEach(s=>s.ex.forEach(e=>{const m=metrics(e,!!s.updated);tot+=m.tot||0;f+=m.fails||0}));
    return `<section class="week"><div class="week-h"><h3>Settimana ${weekOf(k)}</h3><span>dal ${fmtD(k)}</span><span class="spacer"></span><span>${list.length} sedute, ${fmtN(tot)} rep${f?`, ${f} serie fallite`:''}</span></div>
      ${list.map(vSess).join('')}</section>`;
  }).join('');
  if(keys.length>S.storWeeks)h+=`<button class="btn" data-a="moreWeeks" style="width:100%">Mostra altre settimane</button>`;
  return h;
}

function vExHistory(name,noCharts){
  const occ=[];
  for(const s of S.hist)for(const e of s.ex)if(e.n===name)occ.push({s,e,m:metrics(e,!!s.updated)});
  const pts=occ.filter(o=>o.e.st!=='Non eseguito'&&o.m.tot!=null).slice(0,60).reverse();
  let h='';
  if(pts.length>1&&!noCharts){
    h+=chart('Carico (kg)',pts.map(o=>({v:Number(o.e.kg)||null,f:o.m.fails>0,d:o.s.d})),1);
    h+=chart('Volume',pts.map(o=>({v:o.m.vol,f:o.m.fails>0,d:o.s.d})),2);
  }
  h+=occ.slice(0,40).map(({s,e,m})=>`<article class="sess"><div style="padding:10px 12px">
    <div class="sess-t">${s.wo?`<span class="wo">${esc(s.wo)}</span>`:''}<b>${fmtD(s.d)}</b><span class="muted small">${e.kg?`${fmtN(e.kg,e.kg%1?1:0)} kg`:''}${e.pct?`, ${fmtN(e.pct*100)}%`:''}</span></div>

function chart(title,data,dec){
  const W=600,H=200,P=30;const vals=data.map(d=>d.v).filter(v=>v!=null);
  if(!vals.length)return '';
  let lo=Math.min(...vals),hi=Math.max(...vals);if(lo===hi){lo-=1;hi+=1}
  const x=i=>P+(W-2*P)*(data.length===1?.5:i/(data.length-1)),y=v=>H-P-(H-2*P)*(v-lo)/(hi-lo);
  const pts=data.map((d,i)=>d.v==null?null:[x(i),y(d.v)]).filter(Boolean);
  return `<div class="chart"><h3>${title}</h3><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${title} nelle ultime ${data.length} sedute">
    <line x1="${P}" x2="${W-P}" y1="${H-P}" y2="${H-P}" stroke="var(--line)"/>
    <text x="${P}" y="${H-4}" font-size="20" fill="var(--muted)">${fmtD(data[0].d)}</text>
    <text x="${W-P}" y="${H-4}" font-size="20" fill="var(--muted)" text-anchor="end">${fmtD(data[data.length-1].d)}</text>
    <text x="${P}" y="20" font-size="20" fill="var(--muted)">${fmtN(hi,dec)}</text><text x="${P}" y="${H-P-4}" font-size="20" fill="var(--muted)">${fmtN(lo,dec)}</text>
    <polyline fill="none" stroke="var(--ink)" stroke-width="2.5" points="${pts.map(p=>p.join(',')).join(' ')}"/>
    ${data.map((d,i)=>d.v==null?'':`<circle cx="${x(i)}" cy="${y(d.v)}" r="5" fill="${d.f?'var(--ko)':'var(--ok)'}" stroke="var(--surface)" stroke-width="1.5"/>`).join('')}
  </svg><div class="legend"><span><i style="background:var(--ok)"></i>tutte riuscite</span><span><i style="background:var(--ko)"></i>con serie fallite</span></div></div>`;
}

function parseProto(p){
  p=String(p||'').replace(/[″“”]/g,'"').replace(/''|""/g,'"');let m;
  if(m=p.match(/^\s*EDT\s*(\d+)/i))return {type:'edt',min:+m[1]};
  if(/EMOM/i.test(p)){
    let giri=null,sec=null,rep=null;
    if(m=p.match(/EMOM\s*(\d+)\s*x\s*(\d+)\s*x\s*(\d+)\s*"/i)){giri=+m[1];rep=+m[2];sec=+m[3]}
    else if(m=p.match(/EMOM\s*(\d+)\s*x\s*(\d+)\s*"/i)){giri=+m[1];sec=+m[2]}
    else if(m=p.match(/EMOM\s*(\d+)\s*"/i)){sec=+m[1]}
    if(rep==null&&(m=p.match(/"\s*x\s*(\d+)(?!\d)(?!\s*-)/)))rep=+m[1];
    return sec?{type:'emom',giri,sec,rep}:null;
  }
  if((m=p.match(/(?:Rest|Pausa|Rec)\s*(\d+)\s*("|s\b|sec|$|\s)/i))||(m=p.match(/(\d+)\s*"\s*(?:Calf\s*\+\s*)?Rest/i)))return {type:'rest',sec:+m[1]};
  return null;
}

function recPartners(i){
  const ex=S.draft.ex,e=ex[i],out=[i];
  String(e.p||'').split('+').slice(1).forEach(tok=>{
    const t=normN(tok.replace(/(rest|pausa|rec)\s*\d+.*$/i,'').replace(/\d+\s*["″']*/g,''));if(t.length<3)return;
    const j=ex.findIndex((x,k)=>k!==i&&!out.includes(k)&&x.n&&(normN(x.n).startsWith(t)||t.startsWith(normN(x.n).slice(0,Math.max(4,normN(x.n).length)))));
    if(j>=0&&out.length<6)out.push(j)});
  return out;
}
function timerPlan(i){
  const ex=S.draft.ex,e=ex[i],pp=parseProto(e.p);
  if(pp&&pp.type==='emom'){
    let idx=ex.map((x,j)=>[j,parseProto(x.p)]).filter(([,q])=>q&&q.type==='emom'&&emomSig(q)===emomSig(pp)).map(([j])=>j);
    if(idx.length>3)idx=idx.sort((a,b)=>Math.abs(a-i)-Math.abs(b-i)).slice(0,3).sort((a,b)=>a-b);
    return {mode:'emom',idx,pp,label:`Timer ${emomName(idx.length)}`};
  }
  if(pp&&pp.type==='edt'){const o=ex.findIndex((x,j)=>j!==i&&(parseProto(x.p)||{}).type==='edt');return {mode:'edt',idx:o<0?[i]:[i,o].sort((a,b)=>a-b),pp,label:'Timer EDT'}}
  const idx=recPartners(i),rp=idx.map(j=>parseProto(ex[j].p)).find(q=>q&&q.type==='rest')||null;
  return {mode:'rec',idx,pp:rp,label:idx.length>1?`Timer ${grpName(idx.length)}${rp?` ${rp.sec}″`:''}`:rp?`Set&Pause ${rp.sec}″`:'Set&Pause'};
}

function beep(f=880,d=.12,v=.3){
  if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;
  g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d+.03)}catch(e){}
  if(d>.3&&navigator.vibrate)try{navigator.vibrate(300)}catch(e){}
}
function tone(f,d,v,type='sine',when=0,f2=null){
  if(!AC)return;try{const t0=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+.01);
  g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d+.05)}catch(e){}
}
function bell(f,d,v,when=0){[[1,1],[2.76,.45],[5.4,.2]].forEach(([m,a])=>tone(f*m,d/Math.sqrt(m),v*a,'sine',when))}
function whistle(f,d,v,when=0){
  if(!AC)return;try{const t0=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain(),l=AC.createOscillator(),lg=AC.createGain();
  o.frequency.value=f;l.frequency.value=24;lg.gain.value=f*.04;l.connect(lg);lg.connect(o.frequency);
  g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+.02);g.gain.setValueAtTime(v,t0+Math.max(.03,d-.05));g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  o.connect(g);g.connect(AC.destination);o.start(t0);l.start(t0);o.stop(t0+d+.05);l.stop(t0+d+.05)}catch(e){}
}

const digi=(n,gap,when=0,f=2200)=>{for(let i=0;i<n;i++)tone(f,.07,.12,'square',when+i*gap)};
const mar=(f,when=0)=>{tone(f,.55,.35,'sine',when);tone(f*4,.12,.07,'sine',when)};

  ring:{tick:()=>bell(1250,.25,.22),change:()=>ring(3,.16),warn:()=>ring(2,.18),half:()=>ring(1,0),end:()=>ring(8,.12)},
  arcade:{tick:()=>zap(900,1200,.08),change:()=>{zap(440,880,.12);zap(660,1320,.12,.13);zap(880,1760,.18,.26)},warn:()=>{zap(1200,600,.12);zap(1200,600,.12,.16)},half:()=>zap(700,1400,.15),end:()=>[523,659,784,1046,1318].forEach((f,i)=>zap(f,f*1.01,.12,i*.1))},
  tamburo:{tick:()=>drum(0,180),change:()=>{drum();drum(.16);drum(.32,120)},warn:()=>{drum(0,200);drum(.14,200)},half:()=>{drum(0,160);drum(.12,220)},end:()=>{for(let i=0;i<10;i++)drum(i*.07,170);drum(.8,110)}},

const VOCE={tick:n=>n?String(n):'',change:n=>n||'via',warn:n=>n||'attenzione',half:n=>n||'metà',end:()=>'fine'};
function speak(t){try{if(!t||!window.speechSynthesis)return false;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='it-IT';u.rate=1.1;speechSynthesis.speak(u);return true}catch(e){return false}}

}
const beepShort=()=>sound('tick'),beepLong=()=>sound('change'),beepEnd=()=>sound('end');
let WL=null;
async function wake(on){
  try{if(on&&navigator.wakeLock&&!WL){WL=await navigator.wakeLock.request('screen');WL.addEventListener('release',()=>{WL=null})}if(!on&&WL){WL.release();WL=null}}catch(e){}
}
function tStart(){
  ensureAudio();
  const m=S.tmode,c=clone(S.tc[m]);
  if(m==='emom'){c.ex=c.ex.slice(0,c.k).map((e,i)=>({n:e.n||`Esercizio ${i+1}`,rep:num(e.rep),sec:Math.max(5,num(e.sec)||60)}));c.giri=Math.max(1,c.giri);c.lead=Math.max(0,num(c.lead)||0);c.restSec=Math.max(5,num(c.restSec)||60);c.restEndSec=Math.max(5,num(c.restEndSec)||120);c.warnSec=Math.max(0,num(c.warnSec)??3)}
  if(m!=='emom'){c.warnSec=Math.max(0,num(c.warnSec)??3);c.restEndSec=Math.max(5,num(c.restEndSec)||120)}
  if(m==='edt'){c.min=Math.max(1,num(c.min)||15);['a','b'].forEach((k,i)=>{c[k].n=c[k].n||(i?'Esercizio B':'Esercizio A');c[k].rep=num(c[k].rep)||5})}
  if(m==='rec'){c.sec=Math.max(5,num(c.sec)||90);c.mult=Math.max(.25,num(c.mult)||2);c.tr=Math.max(0,num(c.tr)||0);c.between=Math.max(0,num(c.between)??90)}
  if(m==='circ'){c.giri=Math.max(1,c.giri);c.lead=Math.max(0,num(c.lead)||0);c.tr=Math.max(0,num(c.restEx)??15);c.sec=Math.max(0,num(c.restGiro)??60);c.rest='fix';c.auto=true;c.mode='super'}
  T={mode:m==='circ'?'rec':m,kind:m,cfg:c,acc:0,since:now(),paused:false,done:false,lastSec:null};
  if(m==='tst'){const E=ENDU[c.tipo];c.lead=Math.max(0,num(c.lead)||0);c.step=Math.max(1,num(c.step)||5);c.warnSec=Math.max(0,num(c.warnSec)??10);
    Object.assign(T,{counts:[0,0,0],blk:-1,lead:c.lead*1000,total:E.min*60000,bms:E.min*20000})}
  if(m==='rec'||m==='circ'){const b=buildSP(c,m);Object.assign(T,{exs:b.exs,steps:b.steps,linked:b.linked,k:0,phase:'ready',ph0:0,durs:[],restMs:0,blk:0,mk:null,done_k:-1});
    if(T.linked){const f=T.steps.findIndex(st=>T.exs[st.i].s[st.j][1]==='');T.k=f<0?0:f}
    if(m==='circ'){if(c.lead>0)T.phase='lead';else{T.restKind=null;spGo(0,true)}}}
  if(m==='emom'&&c.link&&S.draft)c.link.forEach(j=>{const x=S.draft.ex[j];if(x&&x.s.length<c.giri)setN(x,c.giri)});
  if(m==='emom'){T.slots=[];for(let g=0;g<c.giri;g++){c.ex.forEach((e,i)=>T.slots.push({g,i,sec:e.sec}));if(c.restOn&&g<c.giri-1)T.slots.push({g,i:-1,rest:true,sec:c.restSec})}if(c.restEnd)T.slots.push({g:c.giri-1,i:-1,rest:true,end:true,sec:c.restEndSec});T.total=T.slots.reduce((a,s)=>a+s.sec,0)*1000;T.slot=-1}
  if(m==='edt'){Object.assign(T,{cur:0,adj:c.a.rep,log:[],totalMs:c.min*60000});const tot=T.totalMs;
    const fr={half:[[1/2,'metà']],thirds:[[1/3,'un terzo'],[2/3,'due terzi']],quarters:[[1/4,'un quarto'],[1/2,'metà'],[3/4,'tre quarti']]}[c.frac]||[];
    T.marks=fr.map(([f,say])=>({rem:tot*(1-f),k:'half',say})).concat(String(c.minsLeft||'').split(/[,;\s]+/).map(num).filter(x=>x>0&&x*60000<tot)
      .map(x=>({rem:x*60000,k:'warn',say:x<1?`mancano ${Math.round(x*60)} secondi`:x===1?'manca un minuto':`mancano ${fmtN(x,x%1?1:0)} minuti`})))}
  wake(true);ensureLoop();render();

function buildSP(c,kind){
  const exs=[],steps=[];let linked=false;
  if(kind==='circ'){
    c.items.forEach((it,i)=>{const rep=it.tipo==='rep'?Math.max(1,num(it.val)||10):null;
      exs.push({n:String(it.n||'').trim()||`Stazione ${i+1}`,b:rep,k:0,st:'Eseguito',_w:it.tipo==='rep'?null:Math.max(5,num(it.val)||40),s:Array.from({length:c.giri},()=>[rep??'',''])})});
    for(let g=0;g<c.giri;g++)exs.forEach((e,i)=>steps.push({i,j:g,rest:i<exs.length-1?'tr':'main',w:e._w}));
  }else{
    if(c.links&&S.draft){c.links.forEach(j=>{const x=S.draft.ex[j];if(x)exs.push(x)});linked=exs.length>0}
    if(!linked)c.items.forEach((it,i)=>{const sets=Math.max(1,Math.min(20,num(it.sets)||1)),rep=num(it.rep);
      exs.push({n:String(it.n||'').trim()||(c.items.length>1?`Esercizio ${i+1}`:''),b:rep,k:0,st:'Eseguito',s:Array.from({length:sets},()=>[rep??'',''])})});
    if(c.mode==='super'&&exs.length>1){const R=Math.max(...exs.map(e=>e.s.length));
      for(let r=0;r<R;r++){const g=exs.map((e,i)=>i).filter(i=>exs[i].s.length>r);g.forEach((i,q)=>steps.push({i,j:r,rest:q<g.length-1?'tr':'main'}))}}
    else exs.forEach((e,i)=>{for(let j=0;j<e.s.length;j++)steps.push({i,j,rest:j<e.s.length-1?'main':'between'})});
  }
  if(steps.length)steps[steps.length-1].rest='end';
  return {exs,steps,linked};
}
const spStep=()=>T.steps[T.k];
function spGo(t,immediate){
  const st=spStep();if(!st)return;
  if(T.restKind!=='tr')T.blk=t;
  T.lastSec=null;T.warned=false;T.halfDone=false;
  if(immediate||T.cfg.auto||st.w){T.phase='work';T.ph0=t;sound('change',T.exs[st.i].n||'via')}
  else{T.phase='ready';sound('change')}
}
function spEndSet(t){
  const st=spStep();if(!st)return;
  T.durs.push(t-T.ph0);autoOk(T.exs[st.i],st.j);T.mk=T.k;T.done_k=T.k;T.marked='';
  if(st.rest==='end'){T.workEnd=t;
    if(T.cfg.restEnd){T.final=true;T.phase='rest';T.restKind='end';T.restMs=T.cfg.restEndSec*1000;T.ph0=t;T.lastSec=null;T.warned=false;T.halfDone=false;sound('change','riposo');return}
    tStop();sound('end');return 'stop'}
  let ms=st.rest==='tr'?T.cfg.tr*1000:st.rest==='between'?T.cfg.between*1000:(T.cfg.rest==='mult'?Math.round((t-T.blk)*T.cfg.mult):T.cfg.sec*1000);
  T.restKind=st.rest;
  if(ms<=0){T.k++;spGo(t,true);return}
  T.phase='rest';T.restMs=ms;T.ph0=t;T.lastSec=null;T.warned=false;T.halfDone=false;
}
function spBlockStart(k){while(k>0&&T.steps[k-1].rest==='tr')k--;return k}
function tStop(){
  if(!T)return;T.done=true;T.endClock=clk();T.paused=true;T.acc=T.endClock;autoApply();
  if(!sesActive()){clearInterval(loopId);loopId=null;wake(false)}
  sesAfterTimer();
}
function tReset(){T=null;if(!sesActive()){clearInterval(loopId);loopId=null;wake(false)}render()}
function autoApply(){
  if(!S.draft||T.applied)return;const c=T.cfg;
  if(T.mode==='rec'){if(T.linked&&T.durs.length){const mins=Math.max(1,Math.round((T.workEnd??T.endClock)/60000));T.exs.forEach(x=>x.t=mins);T.applied=true}}
  else if(T.mode==='emom'&&c.link){T.giriFatti=T.slot<0?0:T.slots[T.slot].g+1;
    if(T.giriFatti){const mins=Math.round((T.giriFatti*c.ex.reduce((a,x)=>a+x.sec,0)+(c.restOn?Math.max(0,T.giriFatti-1)*c.restSec:0))/60);c.link.forEach(j=>{const x=S.draft.ex[j];if(x)x.t=mins});T.applied=true}}
  else if(T.mode==='edt'&&c.link&&T.log.length&&T.log.every(l=>c.link[l.k==='a'?0:1]!=null)){
    ['a','b'].forEach((k,n)=>{const log=T.log.filter(l=>l.k===k),lx=S.draft.ex[c.link[n]];if(log.length&&lx){lx.s=log.map(l=>[l.rep,l.rep>=c[k].rep?'ok':'ko']);lx.t=c.min;lx.b=c[k].rep;lx.k=0}});T.applied=true}
  if(T.applied)scheduleSave();
}

/* ---------- seduta: riscaldamento, allenamento, defaticamento ---------- */
let SES=load('diario-sessione');
const sesSave=()=>store('diario-sessione',SES);
const sesActive=()=>!!(SES&&SES.phase&&SES.phase!=='done');
function fmtDur(ms){const x=Math.max(0,Math.floor(ms/1000)),h=Math.floor(x/3600),m=Math.floor(x%3600/60);return h?`${h}:${pad(m)}:${pad(x%60)}`:`${m}:${pad(x%60)}`}
const tempiTxt=t=>`riscaldamento ${fmtDur(t.risc*1000)}, allenamento ${fmtDur(t.allen*1000)}, defaticamento ${fmtDur(t.defat*1000)}, totale ${fmtDur(t.tot*1000)}`;
function ensureLoop(){if(!loopId)loopId=setInterval(tick,100)}
function sesNew(){SES={cfg:clone(S.tc.sess),mode:S.tmode,phase:null,start:null}}
function sesBegin(){if(!SES.start)SES.start=Date.now()}
function startWarm(){sesBegin();SES.phase='warm';SES.warmStart=Date.now();SES._ls=null;sesSave();ensureAudio();wake(true);ensureLoop();sound('change','riscaldamento');render()}
function endWarm(){SES.warmEnd=Date.now();SES.phase='train';sesSave();S.tmode=SES.mode;sound('change','allenamento');tStart()}
function startTrain(){sesBegin();SES.phase='train';sesSave();S.tmode=SES.mode;tStart()}
function startCool(silent){sesBegin();SES.coolStart=Date.now();SES.phase='cool';SES._ls=null;sesSave();ensureAudio();wake(true);ensureLoop();if(!silent)sound('change','defaticamento');render()}
function endSession(){
  const n=Date.now();if(!SES.start)SES.start=n;
  if(SES.phase==='warm')SES.warmEnd=n;if(SES.phase==='cool')SES.coolEnd=n;
  SES.end=n;SES.phase='done';
  const w=SES.warmStart?(SES.warmEnd||n)-SES.warmStart:0,cl=SES.coolStart?(SES.coolEnd||n)-SES.coolStart:0;
  const al=Math.max(0,(SES.coolStart||n)-(SES.warmEnd||SES.start));
  SES.tempi={risc:Math.round(w/1000),allen:Math.round(al/1000),defat:Math.round(cl/1000),tot:Math.round((n-SES.start)/1000)};
  if(S.draft){S.draft.tempi=SES.tempi;scheduleSave();SES.saved=true}
  sesSave();sound('end');if(!T||T.done){wake(false);clearInterval(loopId);loopId=null}render();
}
function sesAfterTimer(){
  if(!SES||SES.phase!=='train')return;
  if(SES.cfg.coolOn&&SES.cfg.coolAuto){startCool(true);return}
  SES.phase='between';sesSave();
}
function phaseClock(n){const k=SES.phase,c=SES.cfg,el=n-(k==='warm'?SES.warmStart:SES.coolStart),tot=Math.max(.25,num(c[k+'Min'])||1)*60000;return {el,tot,fixed:c[k+'Mode']==='fix',rem:tot-el}}

function countdownBeeps(remMs){

    if(T.phase==='lead'){const rem=T.cfg.lead*1000-t;countdownBeeps(rem);if(rem<=0){T.restKind=null;spGo(t,true)}}
    else if(T.phase==='work'){const st=spStep();if(st&&st.w){const rem=st.w*1000-(t-T.ph0);countdownBeeps(rem);warnBeep(rem);halfBeep(rem,st.w*1000);if(rem<=0&&spEndSet(t)==='stop'){render();return}}}
    else if(T.phase==='rest'){const rem=T.restMs-(t-T.ph0);countdownBeeps(rem);warnBeep(rem);halfBeep(rem,T.restMs);
      if(rem<=0){if(T.final){tStop();sound('end');render();return}T.k++;spGo(t,false)}}
  }else if(T.mode==='emom'){

      if(idx===-1){emomAutoOk(T.slot);tStop();beepEnd();render();return}

    const rem=T.totalMs-t;if(rem<=10500)countdownBeeps(rem);warnBeep(rem);

    if(rem<=0){if(T.cfg.restEnd){T.final=true;T.finalStart=t;T.workEnd=t;T.lastSec=null;sound('change','riposo');updateRun();return}tStop();beepEnd();render();return}
  }

  async tstSave(el){const c=T.cfg,E=ENDU[c.tipo],n=String(c.n||'').trim()||'Test';
    const t={id:'t'+Date.now().toString(36),d:todayIso(),n,tipo:c.tipo,kg:num(c.kg)||0,rif:num(c.rif)||null,parts:[...T.counts],tot:T.counts.reduce((a,b)=>a+b,0),note:'Registrato con il timer',updated:Date.now()};
    S.tests.set(t.id,t);await saveTestDoc(t);
    if(el.dataset.d){const d=ensureDraft(),ex=exFromHistory(n,d.d,d.id);delete ex._why;ex.p=`Test ${E.min}′`;if(t.kg)ex.kg=t.kg;ex.b=null;ex.k=0;ex.s=T.counts.map(x=>[x,'ok']);ex.t=E.min;ex.pctMan=false;autoPct(ex,d.d);d.ex.push(ex);scheduleSave()}
    const msg=`${esc(n)}: ${esc(testDesc(t))}.${el.dataset.d?' Inserito anche nella seduta di oggi.':''}`;
    tReset();S.tab='massimali';S.testSub='test';render();window.scrollTo(0,0);
    sheet(`<h3>Test salvato</h3><p class="muted">${msg}</p><div class="row" style="margin-top:14px"><button class="btn primary" data-a="closeSheet">Ok</button></div>`)},
  mfCancel(){S.mf=newMf();render()},
  mfEdit(el){const m=S.misure.get(el.dataset.id);if(!m)return;S.mf={d:m.d,vals:{...(m.vals||{})},note:m.note||'',editId:m.id};render();window.scrollTo(0,0)},
  mfAskDel(el){confirmSheet('Eliminare la misurazione?','I valori di quella data vengono tolti dallo storico.','Elimina','mfDel',`data-id="${esc(el.dataset.id)}"`)},
  async mfDel(el){closeSheet();const x={id:el.dataset.id,deleted:true,updated:Date.now()};S.misure.set(x.id,x);await saveMisDoc(x);render()},
  async mfSave(){const f=S.mf,vals={};MIS.forEach(([k])=>{const v=num(f.vals[k]);if(v>0)vals[k]=v});
    if(!Object.keys(vals).length)return sheet('<h3>Misure non salvate</h3><p class="muted">Inserisci almeno un valore.</p><div class="row" style="margin-top:14px"><button class="btn primary" data-a="closeSheet">Ok</button></div>');
    const m={id:f.editId||('m'+Date.now().toString(36)),d:f.d||todayIso(),vals,note:String(f.note||'').trim(),updated:Date.now()};
    S.misure.set(m.id,m);await saveMisDoc(m);S.mf=newMf();render()},
  tfCancel(){S.tf=newTf();render()},
  tfEdit(el){const t=S.tests.get(el.dataset.id);if(!t)return;S.tf={d:t.d,n:t.n,tipo:t.tipo,kg:t.kg??'',bw:t.bw??'',rep:t.rep??'',rir:t.rir??0,parts:[...(t.parts||['','',''])],rif:t.rif??'',rifTouched:true,from:t.from||t.d,fromTouched:true,note:t.note||'',editId:t.id};S.testSub='test';S.tab='massimali';render();window.scrollTo(0,0)},
  tfAskDel(el){confirmSheet('Eliminare il massimale?','Le percentuali già calcolate restano come sono.','Elimina','tfDel',`data-id="${esc(el.dataset.id)}"`)},
  async tfDel(el){closeSheet();const t=S.tests.get(el.dataset.id);if(!t)return;const x={id:t.id,n:t.n,deleted:true,updated:Date.now()};S.tests.set(x.id,x);await saveTestDoc(x);render()},
  async tfSave(){
    const f=S.tf,n=String(f.n||'').trim(),k=f.tipo,kg=num(f.kg);
    const err=m=>sheet(`<h3>Test non salvato</h3><p class="muted">${m}</p><div class="row" style="margin-top:14px"><button class="btn primary" data-a="closeSheet">Ok</button></div>`);
    if(!n)return err('Indica l’esercizio.');
    const t={id:f.editId||('t'+Date.now().toString(36)),d:f.d||todayIso(),n,tipo:k,note:String(f.note||'').trim(),updated:Date.now()};
    if(k==='1rm'){if(!(kg>0))return err('Indica il carico in kg.');t.kg=kg}
    if(k==='reps'){if(!(kg>0))return err('Indica il carico in kg.');t.kg=kg;t.rep=num(f.rep);t.rir=Math.max(0,num(f.rir)||0);if(!(t.rep>0))return err('Indica quante ripetizioni hai fatto.')}
    if(k==='brz'){t.bw=num(f.bw)||0;t.kg=kg||0;t.rep=num(f.rep);t.rir=Math.max(0,num(f.rir)||0);if(!(t.bw+t.kg>0))return err('Indica il peso corporeo, il sovraccarico o entrambi.');if(!(t.rep>0))return err('Indica quante ripetizioni hai fatto.')}
    if(k==='maxrep'){t.rep=num(f.rep);t.bw=num(f.bw)||null;if(!(t.rep>0))return err('Indica le ripetizioni massime.')}
    if(ENDU[k]){t.kg=kg;t.rif=num(f.rif)||null;t.parts=f.parts.map(x=>num(x)||0);if(!(kg>0))return err('Indica il peso usato.');if(!t.parts.some(x=>x>0))return err('Indica le ripetizioni fatte in almeno un blocco.');t.tot=t.parts.reduce((a,b)=>a+b,0)}
    let msg='';
    if(isRmType(k)){t.from=f.from||t.d;const rm=testRM(t);if(!rm)return err(k==='brz'?'Con 36 ripetizioni o più la formula non permette una stima.':'Con più di 30 ripetizioni la tabella non permette di stimare il massimale.');
      t.rm=Math.round(rm*10)/10;S.tests.set(t.id,t);await saveTestDoc(t);const c=await applyTest(t);
      msg=`${esc(n)}: 1RM ${fmtN(t.rm,1)} kg, usato dal ${fmtD(t.from)}.${c?` Ho aggiornato la % 1RM in ${c} ${c===1?'esercizio':'esercizi'} delle sedute da quella data.`:''}`}
    else{S.tests.set(t.id,t);await saveTestDoc(t);msg=`${esc(n)}: ${esc(testDesc(t))}.`}
    S.tf=newTf();render();
    sheet(`<h3>Test salvato</h3><p class="muted">${msg}</p><div class="row" style="margin-top:14px"><button class="btn primary" data-a="closeSheet">Ok</button></div>`);
  },
  defRebuild(){confirmSheet('Ricalcolare i massimali di default?','Li ricavo di nuovo dalle ultime settimane del foglio Excel; i tuoi test non vengono toccati.','Ricalcola','defRebuildNow')},
  defRebuildNow(){closeSheet();const n=ensureDefaults(true);render();sheet(`<h3>Fatto</h3><p class="muted">${n} massimali di default ricalcolati.</p><div class="row" style="margin-top:14px"><button class="btn primary" data-a="closeSheet">Ok</button></div>`)},
  exportBak(){
    const all=new Map(S.stor);for(const [id,x] of S.sed)all.set(id,x);
    saveFile(`diario-backup-${todayIso()}.json`,JSON.stringify({app:'diario-allenamento',v:1,exported:new Date().toISOString(),cfg:S.cfg,sedute:[...all.values()],test:[...S.tests.values()],misure:[...S.misure.values()]}));
  },
  importBtn(){closeSheet();$('#fileImp').click()},
  eRep(el){T.adj=Math.max(0,T.adj+Number(el.dataset.d));updateRun()},
  eDone(){const k=T.cur?'b':'a';if(T.final){if(T.finalLogged)return;T.log.push({k,rep:T.adj});T.finalLogged=true;beepShort();updateRun();return}T.log.push({k,rep:T.adj});T.cur=1-T.cur;T.adj=T.cfg[T.cur?'b':'a'].rep;beepShort();updateRun()},
};
const canSave=()=>!!S.downloads||STANDALONE;
async function saveFile(filename,data){
  if(S.downloads){try{await S.downloads.save({filename,data})}catch(e){}return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:filename.endsWith('.json')?'application/json':'text/csv'}));
  a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
}
async function importBackup(obj){
  if(!obj||obj.app!=='diario-allenamento'||!Array.isArray(obj.sedute))throw new Error('formato');
  const cur=new Map(S.stor);for(const [id,x] of S.sed)cur.set(id,x);
  const base=[],upd=[];
  for(const x of obj.sedute){
    if(!x||typeof x.id!=='string')continue;
    if(!x.deleted&&(!x.d||!Array.isArray(x.ex)))continue;
    const c=cur.get(x.id);if(c&&(c.updated||0)>=(x.updated||0))continue;
    (x.updated||x.deleted?upd:base).push(x);
  }
  if(S.mode==='db'){for(const x of [...base,...upd])await S.base.collection('sedute').doc(x.id).set(x)}
  else{
    const st=new Map(S.stor);base.forEach(x=>st.set(x.id,x));
    const sd=new Map(S.sed);upd.forEach(x=>sd.set(x.id,x));const m={};sd.forEach((v,k)=>m[k]=v);
    if(!store('diario-storico',[...st.values()])||!store('diario-sedute',m))throw new Error('spazio');
    S.stor=st;S.sed=sd;
  }
  let cfg=false;
  if(obj.cfg){const c=obj.cfg;
    if(c.esercizi)for(const k in c.esercizi)if(!S.cfg.esercizi[k]){S.cfg.esercizi[k]=c.esercizi[k];cfg=true}
    if(c.timer&&!S.cfg.timer){S.cfg.timer=c.timer;S.prefsLoaded=false;loadPrefs();cfg=true}
    if(cfg)saveCfg();
  }
  let nt=0;
  for(const t of Array.isArray(obj.test)?obj.test:[]){if(!t||typeof t.id!=='string')continue;const c=S.tests.get(t.id);
    if(!c||(t.updated||0)>(c.updated||0)){S.tests.set(t.id,t);nt++;if(S.mode==='db')await saveTestDoc(t)}}
  if(nt&&S.mode!=='db')await saveTestDoc({});
  let nm=0;
  for(const m of Array.isArray(obj.misure)?obj.misure:[]){if(!m||typeof m.id!=='string')continue;const c=S.misure.get(m.id);
    if(!c||(m.updated||0)>(c.updated||0)){S.misure.set(m.id,m);nm++;if(S.mode==='db')await saveMisDoc(m)}}
  if(nm&&S.mode!=='db')await saveMisDoc({});
  merge();if(!nt)ensureDefaults();return {n:base.length+upd.length,cfg,nt,nm};
}
async function delSession(id){
  try{
    if(S.mode==='db'){await S.base.collection('sedute').doc(id).set({id,deleted:true,updated:Date.now()})}
    else{const all=load('diario-sedute')||{};all[id]={id,deleted:true};store('diario-sedute',all);S.sed.set(id,{id,deleted:true});merge()}
  }catch(e){}
}

let cfgTimer=null;
function onField(el,isChange){
  const f=el.dataset.f;if(!f)return;const v=el.type==='checkbox'?el.checked:el.value;
  const [kind,a,b]=f.split(':');
  if(kind==='new'){S.newDate=v||todayIso();return}
  if(kind==='st'){S.storEx=v;render();return}
  if(kind==='ex'){S.exQ=v;const l=$('#exList');if(l)l.innerHTML=vExList();return}
  if(kind==='cx'){if(!S.exSel)return;const c=S.cfg.esercizi[S.exSel]=S.cfg.esercizi[S.exSel]||{};c[a]=num(v);saveCfg();return}
  if(kind==='mf'){const f=S.mf;if(a.startsWith('v.'))f.vals[a.slice(2)]=v;else f[a]=v;return}
  if(kind==='tf'){const f=S.tf;if(a.startsWith('parts.'))f.parts[+a.slice(6)]=v;else f[a]=v;
    if(a==='d'&&!f.fromTouched){f.from=v;const el=$('#tfFrom');if(el)el.value=v}
    if(a==='from')f.fromTouched=true;
    if(a==='rif')f.rifTouched=true;
    if((a==='n'||a==='d')&&ENDU[f.tipo]&&!f.rifTouched){const t=maxFor(f.n,f.d);f.rif=t?t.rm:'';const el=$('#tfRif');if(el)el.value=f.rif}
    const r=$('#tfRes');if(r)r.innerHTML=tfResult();return}
  if(kind==='dm'){const t=S.tests.get(a);if(!t)return;const n=num(v);if(!(n>0))return;t.rm=n;t.updated=Date.now();
    clearTimeout(S.dmT);S.dmT=setTimeout(async()=>{await saveTestDoc(t);await applyTest(t)},1200);return}
  if(kind==='tc'){const path=a.split('.');let o=S.tc;for(let i=0;i<path.length-1;i++)o=o[path[i]];o[path[path.length-1]]=v;if(/^(emom|rec|edt)\.(col|warn|rest|half|frac|minsLeft)|^sess\.|^snd\.|^circ\./.test(a))savePrefs();if(/\.(restOn|restEnd|warmOn|coolOn)$/.test(a))render();
    if(a.startsWith('tst.')){const c=S.tc.tst;if(a==='tst.rif')c.rifTouched=true;
      if(a==='tst.n'&&!c.rifTouched){const t=maxFor(c.n,todayIso());c.rif=t?t.rm:'';const el=$('#tstRif');if(el)el.value=c.rif}
      if(/^tst\.(step|lead|warn|half|col)/.test(a))savePrefs();const sg=$('#tstSug');if(sg)sg.textContent=tstSugTxt()}
    return}
  if(kind==='d'){if(!S.draft)return;
    if(a==='d'){if(!v)return;S.draft.d=v;const m=$('#sessMeta');if(m)m.textContent=`${ggOf(v)}, settimana ${weekOf(v)}`;
      S.draft.ex.forEach((e,i)=>{if(autoPct(e,v)){const el=$('#pct-'+i);if(el)el.value=pctShowOf(e);refreshCard(i)}})}
    else S.draft[a]=v;scheduleSave();return}
  if(kind==='e'){
    const i=+a,e=S.draft.ex[i];if(!e)return;
    const setP=()=>{const el=$('#pct-'+i);if(el&&document.activeElement!==el)el.value=pctShowOf(e)};
    if(['kg','z','t'].includes(b)){e[b]=num(v);if(b==='kg'&&autoPct(e,S.draft.d))setP()}
    else if(b==='pct'){const n=num(v);if(n==null){e.pctMan=false;e.pct=null;autoPct(e,S.draft.d)}else{e.pct=n>1.5?n/100:n;e.pctMan=true}}
    else if(b==='b'){e.b=num(v);syncSets(e)}
    else if(b==='k'){e.k=Math.max(0,num(v)||0);syncSets(e)}
    else if(b==='n_s'){const n=num(v);if(n&&n>=1&&n<=20)setN(e,n);else return}
    else e[b]=v;
    if(b==='n'){if(autoPct(e,S.draft.d))setP();const ic=document.querySelector('#card-'+i+' .card-h .exi');if(ic)ic.outerHTML=exIcon(v,38)}
    if(b==='st'&&v==='Non eseguito')e.s.forEach(x=>{x[1]='skip'});
    if(b==='st'&&v==='Eseguito')e.s.forEach(x=>{if(x[1]==='skip')x[1]=''});syncSets(e);
    refreshCard(i);if(b==='p')S.draft.ex.forEach((x,j)=>{const el=$('#tb-'+j);if(el)el.textContent=timerPlan(j).label});scheduleSave();return}
  if(kind==='c'){
    const e=S.draft.ex[+a];if(!e||!e.n)return;const cfg=S.cfg.esercizi[e.n]=S.cfg.esercizi[e.n]||{};cfg[b]=num(v);
    saveCfg();return}
}
document.addEventListener('input',ev=>{const el=ev.target;if(el.tagName==='SELECT'||el.type==='checkbox')return;onField(el)});
document.addEventListener('change',ev=>{const el=ev.target;if(el.tagName==='SELECT'||el.type==='checkbox'||el.type==='date')onField(el,true)});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&((T&&!T.done)||sesActive())){wake(true);tick()}});
window.addEventListener('pagehide',()=>{if(S.draft)persistDraft()});
$('#fileImp').addEventListener('change',async ev=>{
  const f=ev.target.files[0];ev.target.value='';if(!f)return;
  const done=(t,m)=>sheet(`<h3>${t}</h3><p class="muted">${m}</p><div class="row" style="margin-top:14px"><button class="btn primary" data-a="closeSheet">Chiudi</button></div>`);
  sheet('<h3>Importo il backup…</h3>');
  try{const r=await importBackup(JSON.parse(await f.text()));
    done('Backup importato',(r.n?`${r.n} sedute nuove o aggiornate.`:'Nessuna seduta nuova: era già tutto presente.')+(r.nt?` ${r.nt} test e massimali importati.`:'')+(r.nm?` ${r.nm} misurazioni importate.`:'')+(r.cfg?' Ho ripreso anche le impostazioni dei timer e della progressione.':''));render()}
  catch(e){done('Backup non importato',e&&e.message==='spazio'?'Lo spazio del browser per questa app è pieno.':'Il file non è un backup del diario: scegli il file diario-backup….json esportato dall’app.')}
});
if(STANDALONE&&'serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
if(SES&&SES.phase==='train')SES.phase='between';
if(sesActive())ensureLoop();
init();
